<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Digi<span>Flix</span></a>
    <div class="nav-links">
      <a href="index.html" class="active">Browse</a>
      <a href="index.html?watchlist=1">Watchlist</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Stream <em>anything.</em><br />For Zilch, Nada, Zero</h1>
    <p id="heroStats">Loading the swarm...</p>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off" />
    </div>
  </section>

  <div class="filters-bar">
    <span class="filter-label">Type</span>
    <div class="genre-pills" id="contentTypeToggle">
      <button class="pill active" type="button" data-type="movies">Movies</button>
      <button class="pill" type="button" data-type="shows">TV Shows</button>
    </div>
    <div class="sort-divider"></div>
    <span class="filter-label">Genre</span>
    <div class="genre-pills" id="genrePills">
      <button class="pill active" type="button" data-genre="">All</button>
      <button class="pill" type="button" data-genre="action">Action</button>
      <button class="pill" type="button" data-genre="drama">Drama</button>
      <button class="pill" type="button" data-genre="comedy">Comedy</button>
      <button class="pill" type="button" data-genre="horror">Horror</button>
      <button class="pill" type="button" data-genre="sci-fi">Sci-Fi</button>
      <button class="pill" type="button" data-genre="animation">Animation</button>
      <button class="pill" type="button" data-genre="thriller">Thriller</button>
      <button class="pill" type="button" data-genre="romance">Romance</button>
      <button class="pill" type="button" data-genre="documentary">Documentary</button>
      <button class="pill" type="button" data-genre="crime">Crime</button>
      <button class="pill" type="button" data-genre="fantasy">Fantasy</button>
    </div>
    <div class="sort-divider"></div>
    <select class="sort-select" id="sortSelect" aria-label="Sort titles">
      <option value="download_count">Most Popular</option>
      <option value="rating">Top Rated</option>
      <option value="date_added">Newest</option>
      <option value="year">By Year</option>
      <option value="title">A-Z</option>
    </select>
    <button class="watchlist-toggle" id="watchlistToggle" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      Watchlist
    </button>
  </div>

  <div class="grid-section">
    <div class="section-meta">
      <span class="section-title" id="sectionTitle">Trending Movies</span>
      <span class="section-count" id="sectionCount"></span>
    </div>
    <div class="movie-grid" id="movieGrid" aria-live="polite"></div>
  </div>

  <div class="pagination" id="pagination"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
